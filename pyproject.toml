[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "halfrand"
version = "0.1.0"
description = "Generate reproducible pseudo-random sequences with bounded variation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chien-Hsun Chang" }]
keywords = ["random", "random-walk", "data-generation", "simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/KageRyo/HalfRand"
Issues = "https://github.com/KageRyo/HalfRand/issues"
Source = "https://github.com/KageRyo/HalfRand"

[project.scripts]
halfrand = "halfrand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["halfrand"]
branch = true
