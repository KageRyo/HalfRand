name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked build tools
        run: |
          python -m pip install --only-binary :all: --require-hashes -r .github/requirements/ci.txt
      - name: Build distributions without fetching isolated build dependencies
        run: python -m build --no-isolation
      - name: Install the built local wheel
        run: |
          python - <<'PYCODE' > "$RUNNER_TEMP/halfrand-wheel.txt"
          from hashlib import sha256
          from pathlib import Path

          for wheel in Path("dist").glob("*.whl"):
              print(f"{wheel.resolve().as_uri()} --hash=sha256:{sha256(wheel.read_bytes()).hexdigest()}")
          PYCODE
          python -m pip install --only-binary :all: --require-hashes --no-index --no-deps -r "$RUNNER_TEMP/halfrand-wheel.txt"
      - run: python -m unittest discover -s tests -v
